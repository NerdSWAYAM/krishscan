<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KrishiScan Login</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url("{% static 'story_hero.png' %}") no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }
        
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: inherit;
            filter: blur(10px);
            z-index: -2;
        }

        body::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: -1;
        }

        .container {
            width: 400px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.5);
            animation: fadeIn 0.8s ease-out;
            position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .logo {
            font-size: 32px;
            font-weight: 600;
            color: #2e7d32;
            margin-bottom: 25px;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-left: 10px;
        }

        input {
            width: 100%;
            padding: 14px 20px;
            margin-top: 8px;
            border-radius: 30px;
            border: 1px solid rgba(46, 125, 50, 0.4);
            font-size: 14px;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #2e7d32;
            box-shadow: 0 0 10px rgba(46, 125, 50, 0.3);
            background: #fff;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            background: linear-gradient(135deg, #2e7d32, #1b5e20);
            color: white;
            font-size: 16px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(46, 125, 50, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(46, 125, 50, 0.6);
        }

        .register {
            margin-top: 20px;
            font-size: 14px;
            text-align: center;
        }

        .register a {
            color: #2e7d32;
            text-decoration: none;
            font-weight: 600;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        .register a:hover {
            color: #1b5e20;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #555;
            text-align: center;
        }
        
        .close-btn {
            font-size: 28px;
            color: #666;
            cursor: pointer;
            transition: color 0.3s;
        }
        
        .close-btn:hover {
            color: #ff3b30;
        }
        
        .header-actions {
            display: flex;
            justify-content: flex-end;
            margin-bottom: -15px;
        }
        
        a {
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- <a href="{% url 'home' %}" style="text-decoration:none;">🔙</a> -->
         <div class="header-actions">
            <a href="{% url 'home' %}"><span class="close-btn">&times;</span></a>
         </div>
        <div class="logo">🌾 KrishiScan</div>
        <form>

            <div class="input-group">
                <label>Email</label>
                <input type="email" placeholder="Enter your email" id="email" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="Enter your password" id="pass" required>
            </div>

            <!-- <div class="input-group">
                <label>Login As</label>
                <select required>
                    <option value="">Select Role</option>
                    <option value="farmer">Farmer</option>
                    <option value="consumer">Consumer</option>
                </select>
            </div> -->

            <button type="submit">Login</button>

            <div class="register">
                <a href="{% url 'signup' %}">Register</a>
            </div>

        </form>

        <div class="footer">
            © 2026 KrishiScan
        </div>

    </div>

    <script>
        document.querySelector("form").addEventListener("submit", function (e) {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const pass = document.getElementById("pass").value;
            console.log(email, pass);

            // Redirect the user back to the index page
            window.location.href = "{% url 'dashboard' %}";
        });
    </script>
</body>

</html>
