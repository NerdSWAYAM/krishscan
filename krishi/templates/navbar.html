<style>
/* ─── NAVBAR ─── */
.navbar {
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 40px; background:var(--color-bg-surface); border-bottom:1px solid var(--color-border);
  position:sticky; top:0; z-index:100;
}
.navbar .logo { font-size:1.5rem; font-weight:700; color:var(--color-primary-dark); }
.navbar .logo span { color:var(--color-primary); }
.nav-links { display:flex; gap:28px; align-items:center; }
.nav-links a {
  text-decoration:none; color:var(--color-text-muted); font-size:.9rem; font-weight:500;
  transition:color var(--transition-fast);
}
.nav-links a:hover, .nav-links a.active { color:var(--color-primary-dark); }
.nav-links .cart-btn {
  position:relative; background:none; border:none; cursor:pointer; font-size:1.3rem;
}
.nav-links .cart-btn .badge {
  position:absolute; top:-6px; right:-10px; background:var(--color-accent); color:var(--color-bg-surface);
  font-size:.65rem; width:18px; height:18px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-weight:700;
}
@media(max-width:768px){
  .navbar { padding:14px 20px; }
  .nav-links a { font-size:.8rem; }
}
</style>

<nav class="navbar">
  <div class="logo">Krishi<span>Scan</span></div>
  <div class="nav-links">
    <a href="{% url 'marketplace' %}" class="{% if request.resolver_match.url_name == 'marketplace' %}active{% endif %}">Marketplace</a>
    <a href="#">My Orders</a>
    {% if request.session.role == 'Farmer' %}
      <a href="{% url 'disease_detect' %}" class="{% if request.resolver_match.url_name == 'disease_detect' %}active{% endif %}">Disease Detection</a>
      <a href="{% url 'dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">Dashboard</a>
    {% else %}
      <a href="{% url 'consumerdash' %}" class="{% if request.resolver_match.url_name == 'consumerdash' %}active{% endif %}">Dashboard</a>
    {% endif %}
    <button class="cart-btn" id="openCart">
      🛒
      <span class="badge" id="cartBadge">3</span>
    </button>
  </div>
</nav>
