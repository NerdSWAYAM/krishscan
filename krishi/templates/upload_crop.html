<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KrishiScan - Upload Crop</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url("{% static 'story_hero.png' %}") no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }
        
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: inherit;
            filter: blur(10px);
            z-index: -2;
        }

        body::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: -1;
        }

        .container {
            width: 450px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.5);
            animation: fadeIn 0.8s ease-out;
            position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .logo {
            font-size: 28px;
            font-weight: 600;
            color: #2e7d32;
            margin-bottom: 25px;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-left: 10px;
            display: block;
        }

        input {
            width: 100%;
            padding: 14px 20px;
            margin-top: 8px;
            border-radius: 30px;
            border: 1px solid rgba(46, 125, 50, 0.4);
            font-size: 14px;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
        }
        
        input[type="file"] {
            border-radius: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.7);
        }

        input:focus {
            outline: none;
            border-color: #2e7d32;
            box-shadow: 0 0 10px rgba(46, 125, 50, 0.3);
            background: #fff;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            background: linear-gradient(135deg, #2e7d32, #1b5e20);
            color: white;
            font-size: 16px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(46, 125, 50, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(46, 125, 50, 0.6);
        }

        .close-btn {
            font-size: 28px;
            color: #666;
            cursor: pointer;
            transition: color 0.3s;
        }
        
        .close-btn:hover {
            color: #ff3b30;
        }
        
        .header-actions {
            display: flex;
            justify-content: flex-end;
            margin-bottom: -15px;
        }
        
        a {
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="container">
         <div class="header-actions">
            <a href="{% url 'marketplace' %}"><span class="close-btn">&times;</span></a>
         </div>
        <div class="logo">🌾 Upload New Crop</div>
        
        <form method="POST" action="{% url 'upload_crop' %}" enctype="multipart/form-data">
            {% csrf_token %}
            
            {% if messages %}
                {% for message in messages %}
                    <div style="color: #2e7d32; background: #e8f5e9; padding: 10px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-size: 14px;">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <div class="input-group">
                <label>Name of Crop</label>
                <input type="text" name="name" placeholder="e.g. Organic Tomatoes" required>
            </div>

            <div class="input-group">
                <label>Total Quantity Available (kg)</label>
                <input type="number" step="0.01" name="quantity" placeholder="e.g. 150" required>
            </div>

            <div class="input-group">
                <label>Price per kg (₹)</label>
                <input type="number" step="0.01" name="price_per_kg" placeholder="e.g. 45.50" required>
            </div>
            
            <div class="input-group">
                <label>Upload Image</label>
                <input type="file" name="image" accept="image/*" required>
            </div>

            <button type="submit">Publish to Marketplace</button>
        </form>

    </div>
</body>
</html>
