<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}KrishiScan{% endblock %}</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'global.css' %}">
    {% block extra_css %}{% endblock %}
    <style>
        /* Base Layout Styles */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        .main-content {
            flex: 1;
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }
        
        @media(max-width:768px){
            .main-content { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- Universal Navbar -->
    {% include 'navbar.html' %}

    <!-- Page Content wrapped with transition class -->
    <main class="main-content page-enter">
        {% block banner %}{% endblock %}
        {% block content %}
        {% endblock %}
    </main>

    {% block extra_js %}{% endblock %}

</body>
</html>
